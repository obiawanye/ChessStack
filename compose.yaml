
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chessstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chessstack_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chessstack}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chessstack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-chessstack} -d ${POSTGRES_DB:-chessstack}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chessstack_postgres_data:
